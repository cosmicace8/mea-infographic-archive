<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>論文情報インフォグラフィック</title>
    <!-- Google Fonts: 日本語と英語に対応したフォントを読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* 基本スタイル */
        body {
            font-family: 'Noto Sans JP', 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6; /* 背景色 */
            color: #333;
            line-height: 1.6;
        }
        /* コンテナ */
        .container {
            max-width: 900px;
            margin: 30px auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); /* 影 */
            padding: 40px;
            border-top: 8px solid #4CAF50; /* アクセントカラー */
        }
        /* 見出し1 (ページタイトル) */
        h1 {
            color: #2c3e50;
            font-size: 2.2em;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.3;
        }
        /* 見出し2 (セクションタイトル) */
        h2 {
            color: #4CAF50; /* アクセントカラー */
            font-size: 1.5em;
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 2px solid #e0e0e0; /* 下線 */
            padding-bottom: 5px;
            display: flex;
            align-items: center;
        }
        h2 svg, h2 i { /* アイコンのスタイル */
            margin-right: 10px;
            color: #4CAF50;
        }
        /* 各セクションの余白 */
        .section {
            margin-bottom: 25px;
        }
        .section p, .section ul {
            margin: 0;
            padding: 0;
        }
        /* 著者リスト */
        .authors {
            font-size: 1.1em;
            color: #555;
            text-align: center;
            margin-bottom: 30px;
        }
        .authors span { /* 各著者のタグスタイル */
            display: inline-block;
            margin: 0 5px 5px 0;
            padding: 3px 8px;
            background-color: #e8f5e9; /* 薄い緑の背景 */
            border-radius: 4px;
            font-size: 0.9em;
        }
        /* メタ情報 (出典、DOI、URL) */
        .meta-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            margin-top: 20px;
            gap: 20px; /* アイテム間の隙間 */
        }
        .meta-item { /* 各メタ情報のカードスタイル */
            flex: 1;
            min-width: 250px;
            background-color: #f9f9f9;
            border-left: 4px solid #81c784; /* 左側のアクセントライン */
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .meta-item strong { /* メタ情報のタイトル */
            display: block;
            color: #4CAF50;
            margin-bottom: 5px;
            font-size: 1.1em;
        }
        .meta-item a { /* リンクのスタイル */
            color: #1976d2; /* 青色のリンク */
            text-decoration: none;
            word-break: break-all; /* 長いURLの折り返し */
        }
        .meta-item a:hover {
            text-decoration: underline;
        }
        /* キーワードリスト */
        .keywords-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .keywords-list li { /* 各キーワードのタグスタイル */
            background-color: #e0f2f7; /* 薄い水色の背景 */
            color: #0288d1;
            padding: 6px 12px;
            border-radius: 20px; /* 角丸 */
            font-size: 0.9em;
            font-weight: 500;
            border: 1px solid #b3e5fc;
        }
        /* 日本語要約 */
        .summary {
            background-color: #e3f2fd; /* 薄い青の背景 */
            border-left: 6px solid #2196f3; /* 左側のアクセントライン */
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .summary p {
            font-size: 1.1em;
            color: #3f51b5;
        }
        /* フッター */
        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9em;
            color: #777;
            border-top: 1px dashed #e0e0e0; /* 点線の上線 */
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>論文情報インフォグラフィック</h1>

        <div class="section">
            <h2><i class="fas fa-book-open"></i> 論文タイトル</h2>
            <p id="paper-title" style="font-size: 1.4em; font-weight: bold; color: #333; text-align: center;"></p>
        </div>

        <div class="section">
            <h2><i class="fas fa-users"></i> 著者</h2>
            <div id="authors-list" class="authors">
                <!-- 著者はJavaScriptで挿入されます -->
            </div>
        </div>

        <div class="section">
            <h2><i class="fas fa-info-circle"></i> 詳細情報</h2>
            <div class="meta-info">
                <div class="meta-item">
                    <strong><i class="fas fa-journal-whills"></i> 出典</strong>
                    <p id="source-info"></p>
                </div>
                <div class="meta-item">
                    <strong><i class="fas fa-fingerprint"></i> DOI</strong>
                    <p><a id="doi-link" href="#" target="_blank"></a></p>
                </div>
                <div class="meta-item">
                    <strong><i class="fas fa-link"></i> PubMed URL</strong>
                    <p><a id="pubmed-url" href="#" target="_blank"></a></p>
                </div>
            </div>
        </div>

        <div class="section">
            <h2><i class="fas fa-tags"></i> キーワード</h2>
            <ul id="keywords-list" class="keywords-list">
                <!-- キーワードはJavaScriptで挿入されます -->
            </ul>
        </div>

        <div class="section">
            <h2><i class="fas fa-language"></i> 日本語要約</h2>
            <div class="summary">
                <p>本研究は、クルクミンが熱中症によって引き起こされる心筋損傷および心室性不整脈を軽減する効果があることを示しています。この効果は、BAX/BCL-2/caspase-3経路の調節を介していることが示唆されています。</p>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2023 論文情報インフォグラフィック</p>
        </div>
    </div>

    <script>
        // 提供された論文情報
        const paperData = {
            "title": "Curcumin attenuates heatstroke-induced myocardial injury and ventricular arrhythmias by regulating the BAX/BCL-2/caspase-3 pathway.",
            "url": "https://pubmed.ncbi.nlm.nih.gov/42108873/",
            "authors": "Shao S, Tang B, Liang J, Wang X, Xu C, Rejiepu M, Guo Y, Wen L, Zhang L.",
            "source": "Food Funct. 2026 May 8. doi: 10.1039/d5fo04307g. Online ahead of print.",
            "doi": "10.1039/d5fo04307g",
            "keywords": "Curcumin, heatstroke, myocardial injury, ventricular arrhythmias, BAX/BCL-2/caspase-3 pathway",
            "uses_hd_mea": false,
            "spike_sorting_method": ""
        };

        // 論文タイトルを挿入
        document.getElementById('paper-title').textContent = paperData.title;

        // 著者を挿入
        const authorsContainer = document.getElementById('authors-list');
        paperData.authors.split(', ').forEach(author => {
            const span = document.createElement('span');
            span.textContent = author.trim();
            authorsContainer.appendChild(span);
        });

        // 出典を挿入
        document.getElementById('source-info').textContent = paperData.source.replace(/doi: .*/, '').trim();

        // DOIを挿入
        const doiLink = document.getElementById('doi-link');
        doiLink.href = `https://doi.org/${paperData.doi}`;
        doiLink.textContent = paperData.doi;

        // PubMed URLを挿入
        const pubmedLink = document.getElementById('pubmed-url');
        pubmedLink.href = paperData.url;
        pubmedLink.textContent = paperData.url.replace('https://', '');

        // キーワードを挿入
        const keywordsList = document.getElementById('keywords-list');
        paperData.keywords.split(', ').forEach(keyword => {
            const li = document.createElement('li');
            li.textContent = keyword.trim();
            keywordsList.appendChild(li);
        });
    </script>
</body>
</html>
